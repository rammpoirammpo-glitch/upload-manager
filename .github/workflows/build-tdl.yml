name: Build and publish tdl Docker image

# Publishes ghcr.io/<owner>/tdl:latest (amd64 + arm64) so the
# umbrelOS store always points at a freshly built image.
on:
  push:
    paths:
      - "uploadmgr-tdl/**"
    tags: ["tdl-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Use the auto-generated repository token so the image is published into
      # the repository namespace (ghcr.io/<owner>/<repo>/tdl). Because this repo
      # is public, the container package becomes public automatically, letting
      # umbrelOS pull it without credentials.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./uploadmgr-tdl
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/tdl:latest
            ghcr.io/${{ github.repository }}/tdl:${{ github.ref_name }}
