name: Build and publish Docker image

# Publishes ghcr.io/<owner>/upload-manager:latest (amd64 + arm64) so the
# umbrelOS store always points at a freshly built image.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: rammpoirammpo-glitch
          password: ${{ secrets.GH_PAT }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/upload-manager:latest
            ghcr.io/${{ github.repository_owner }}/upload-manager:${{ github.ref_name }}
