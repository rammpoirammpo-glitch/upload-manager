name: Build and publish tgdl Docker image

# Publishes ghcr.io/<owner>/<repo>/tgdl:latest (amd64 + arm64) using the
# auto-generated repository token so the image is public with a public repo.
on:
  push:
    paths:
      - "uploadmgr-tgdl/**"
    tags: ["tgdl-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./uploadmgr-tgdl
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/tgdl:latest
            ghcr.io/${{ github.repository }}/tgdl:${{ github.ref_name }}
