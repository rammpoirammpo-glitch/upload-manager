releaseNotes: >-
  Fixes the cloud providers unable to connect / Test failing with
  "'NoneType' object is not callable" (1.5.2). The EarnVids-style file host
  (StreamHG/EarnVids/Vidoza/LuluStream), Mixdrop and StreamTape providers each
  stored their keep-alive requests session on an attribute whose name
  shadowed the _session() method, so every _session() call crashed and both
  the Test button and uploads reported the cloud as unreachable. The backing
  attribute is renamed (_sess) and the session getter is verified by new
  regression tests, so a down-cloud Test now reports the real API error
  instead of a spurious Python TypeError. Includes the full security and
  stress hardening from 1.5.1: path-traversal is impossible, SFTP got socket
  timeouts + keepalive (a dead host can no longer freeze a worker), bounded
  scheduler LIMIT for huge queues, orphaned S3 multipart uploads are aborted
  on delete, a watcher memory leak is fixed (DELETE_AFTER_UPLOAD=false),
  notification spam for deleted items is suppressed, and 11 stress/security
  tests + 2 session regression tests verify 150-file concurrent routing,
  crash safety, weird filenames, traversal/self-overwrite blocking, memory
  bounds and the self-heal watchdog cycle. CI runs ruff + 51 tests.
