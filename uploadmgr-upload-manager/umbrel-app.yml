releaseNotes: >-
  Production-hardening release (1.4.0). Telegram is now bridged directly to the
  logging system (every WARNING/ERROR is forwarded, rate-limited) and runs on a
  single worker thread with per-message coalescing so a failing provider cannot
  flood your phone. HTTP timeouts are config-driven with a sane read cap so a
  stalled upload can never freeze a worker. Retries use capped exponential
  backoff with jitter. Completed items older than 30 days are auto-pruned so the
  database cannot grow forever. Scans now run in the background (the dashboard
  never blocks even on huge folders), /api/logs reads only the file tail, and a
  new /api/status reports thread health, last scan stats and queue/provider
  counts. The scheduler no longer busy-loops items whose routing points at a
  disabled/deleted provider. Full refactor: shared multipart/timeout plumbing,
  ruff-clean code, graceful daemon shutdown, and a CI workflow (ruff + 31 tests)
  covering routing isolation at scale, backoff bounds, pruning, notifier rate
  limits and the complete scan/queue/upload pipeline.
