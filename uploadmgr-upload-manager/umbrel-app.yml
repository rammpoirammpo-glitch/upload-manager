manifestVersion: 1.1
id: uploadmgr-upload-manager
category: media
name: Upload Manager
version: "1.2.8"
tagline: Upload *arr downloads to cloud file hosts
icon: https://raw.githubusercontent.com/rammpoirammpo-glitch/upload-manager/main/app/static/icon.svg
description: >-
  Watches the completed downloads produced by Radarr, Sonarr, Readarr, Lidarr and
  the rest of the *arr family, checks file stability, then uploads each file in
  parallel to multiple cloud file hosts (EarnVids-style, WebDAV, S3, SFTP and
  local folders). Includes a web dashboard, retry/backoff, persistent SQLite
  state, and Telegram notifications on upload success and failures.


  SETUP

  1. Open the app dashboard.
  2. Add your cloud providers (file hosts, WebDAV, S3, SFTP, local) and Test them.
  3. Add watch paths pointing at the shared downloads folder, e.g.
     /downloads/movies, /downloads/tv, /downloads/books, /downloads/music.
  4. Optional: set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in this app's config
     to receive upload success/error messages.
developer: Your Name
website: https://github.com/rammpoirammpo-glitch/upload-manager
repo: https://github.com/rammpoirammpo-glitch/upload-manager
support: https://github.com/rammpoirammpo-glitch/upload-manager/issues
port: 8080
gallery:
  - https://raw.githubusercontent.com/rammpoirammpo-glitch/upload-manager/main/app/static/icon.svg
path: ""
dependencies: []
defaultUsername: ""
defaultPassword: ""
permissions:
  - STORAGE_DOWNLOADS
releaseNotes: >-
  New: platform presets for the Xvids-style File Host provider. Add StreamHG,
  EarnVids (and more later) with one click: pick the platform preset and it
  auto-fills the API host, then paste your API key. StreamHG is supported out
  of the box. Also adds StreamTape and Mixdrop providers, per-path provider
  routing, automatic cloud folders, and all previous stability fixes.
