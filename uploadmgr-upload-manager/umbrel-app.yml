releaseNotes: >-
  High-speed upload release (1.5.0). S3/R2/B2 uploads are now split into
  parallel multipart parts (S3_CHUNK_SIZE_MB parts, S3_MAX_CONCURRENCY at
  once) to saturate 1Gbps+ uplinks, and they RESUME byte-level across retries
  and container restarts: the multipart upload id is persisted per task and a
  retry lists the already-uploaded parts from the server and only uploads the
  missing ones. All HTTP providers (StreamHG/EarnVids/Vidoza/LuluStream,
  Mixdrop, StreamTape, WebDAV) now use keep-alive connection pooling
  (requests.Session + HTTPAdapter) so repeated calls to the same host reuse
  TCP/TLS connections. Retries are handled by the tenacity library (capped
  exponential backoff + jitter) with attempts and resume state persisted to
  the database. Logs are rotated (5MB x 5) so the disk cannot fill, and
  /api/status now reports the process memory (RSS) to catch leaks on 24/7
  runs. Data safety unchanged: a file is deleted locally only after every
  provider confirms success. Includes a CI workflow (ruff + 38 tests) with
  in-memory S3 (moto) coverage of parallel multipart and resume.
