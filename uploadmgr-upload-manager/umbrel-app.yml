releaseNotes: >-
  Security & stress-hardening release (1.5.1), the result of a full code
  audit and stress test. Path traversal is now impossible: watch-path remote
  folders are sanitized (never emit .. segments) and the Local provider
  refuses to write outside its target directory or overwrite the source file.
  SFTP uploads got explicit socket/channel timeouts + keepalive, so a dead
  remote host can no longer freeze a worker (and the queue) forever. The
  scheduler scans pending items with a bounded LIMIT, so queues with tens of
  thousands of items stay cheap per tick. Orphaned S3 multipart uploads are
  aborted when their queue item is deleted (no server-side leaks), and
  botocore's internal retries are bounded. A watcher memory leak was fixed:
  queued files no longer keep an in-memory entry forever when
  DELETE_AFTER_UPLOAD=false. Notification spam for deleted items is
  suppressed, and worker threads survive items being deleted mid-upload.
  Added 11 stress/security tests: 150-file concurrent stress with zero
  cross-routing, weird/unicode/long filenames, provider-crash file safety
  (local file survives failed uploads), path-traversal and self-overwrite
  blocking, memory-bound checks and the full self-heal watchdog cycle.
  CI now runs ruff + 49 tests.
