manifestVersion: 1.1
id: uploadmgr-tdl
category: utilities
name: Telegram Downloader (tdl-web)
version: "0.1.4"
tagline: Download, upload and forward Telegram files from your browser
icon: https://cdn.jsdelivr.net/gh/rammpoirammpo-glitch/upload-manager@main/uploadmgr-tdl/icon.svg
description: >-
  tdl-web is a full graphical web interface for tdl, a blazing-fast, low
  resource Telegram Downloader written in Go. Log in by scanning a QR code with
  your Telegram app (or a phone + code), then browse your chats and messages,

  download media to your umbrelOS device, upload files back to Telegram, and
  forward messages between chats — all from the browser, no command line.


  ## First run

  1. Open the app in the Umbrel dashboard.
  2. Enter your Telegram API_ID and API_HASH (free from my.telegram.org).
  3. Scan the QR code with your Telegram app (or sign in with a phone + code).
  4. Use the dashboard to download, upload and forward files.


  ## Features

  - QR-code / phone login, session persisted across restarts
  - Browse chats/channels and their messages
  - Download media (photos, documents, videos) to the device
  - Upload local files to any chat
  - Forward messages between chats
  - Live progress for downloads and uploads

  Downloads and your login session are stored under this app's data directory.
developer: Upload Manager
website: https://github.com/rammpoirammpo-glitch/upload-manager
repo: https://github.com/iyear/tdl
support: https://github.com/iyear/tdl/issues
port: 8050
gallery:
  - https://cdn.jsdelivr.net/gh/rammpoirammpo-glitch/upload-manager@main/uploadmgr-tdl/icon.svg
path: ""
dependencies: []
defaultUsername: ""
defaultPassword: ""
permissions: []
releaseNotes: >-
  v0.1.4: replace the PNG logo with a proper vector SVG icon so it displays in
  the Umbrel app card (Umbrel only shows vector SVGs).

  v0.1.3: change app listening port from 8080 to 8050 to avoid any clash with
  port 8080 on the device.

  v0.1.2: allow the app's /api/* JSON endpoints through the Umbrel app_proxy
  so the dashboard fully works inside the Umbrel UI.

  v0.1.1: fix app showing as "not installed" on umbrelOS — the container now
  runs as root (Umbrel default) so it can open its state DB under /data and
  actually start its web UI.

  v0.1.0: initial web UI release — full Telegram control (login, browse,
  download, upload, forward) from the browser via a Go + gotd backend.
submitter: Upload Manager
