version: "3.8"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: uploadmgr-tdl_server_1
      APP_PORT: 8050
      # Let the web UI call the JSON API without being caught by the
      # app_proxy auth layer (same pattern as readarr in this store).
      PROXY_AUTH_ADD: "false"
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    # Published automatically by .github/workflows/build-tdl.yml.
    image: ghcr.io/rammpoirammpo-glitch/upload-manager/tdl:latest
    restart: on-failure
    volumes:
      # Persistent Telegram session, config and downloads
      - ${APP_DATA_DIR}/data:/data