manifestVersion: 1.1
id: uploadmgr-whisparr
category: media
name: Whisparr
version: "3.0.0.1181"
tagline: Manage your adult media collection
icon: https://i.imgur.com/3jVS6lO.png
description: >-
  Whisparr is an adult media collection manager for Usenet and BitTorrent users.
  It can monitor multiple RSS feeds for new movies and scenes and will interface
  with download clients and indexers to grab, sort and rename them, and can be
  configured to automatically upgrade the quality of existing files in the
  library when a better quality format becomes available.


  SETUP

  Whisparr on umbrelOS automatically connects to download clients installed from
  the umbrelOS App Store. Simply install Transmission (or qBittorrent / SABnzbd)
  from the umbrelOS App Store and the connection is set up for you.

  All you need to do from there is add an indexer so Whisparr can search for
  content. You can add indexers directly, or install Prowlarr from the umbrelOS
  App Store and add your indexers there - they become available in Whisparr
  automatically.

  This app is fully separate from any other app in this store and is provided
  using a community-maintained image (hotio).
developer: Your Name
website: https://whisparr.com
repo: https://github.com/Whisparr/Whisparr
support: https://github.com/Whisparr/Whisparr/issues
port: 6969
gallery:
  - https://i.imgur.com/3jVS6lO.png
path: ""
dependencies:
  - transmission
defaultUsername: ""
defaultPassword: ""
permissions:
  - STORAGE_DOWNLOADS
releaseNotes: >-
  Adds Whisparr to this store with automatic integration: declares Transmission
  as a dependency and uses the umbrelOS media-app-configurator so Whisparr
  auto-connects to download clients installed from the umbrelOS App Store
  (Transmission, and optionally qBittorrent/SABnzbd). Indexers are added via
  Prowlarr or directly.
submitter: Your Name
submission: https://github.com/rammpoirammpo-glitch/upload-manager
