manifestVersion: 1.1
id: uploadmgr-whisparr
category: media
name: Whisparr
version: "2.2.0.108"
tagline: Manage your adult media collection
icon: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/whisparr-icon.png
description: >-
  Whisparr is an adult media collection manager for Usenet and BitTorrent users.
  It can monitor multiple RSS feeds for new movies and scenes and will interface
  with download clients and indexers to grab, sort and rename them, and can be
  configured to automatically upgrade the quality of existing files in the
  library when a better quality format becomes available.


  SETUP

  1. Open the Whisparr dashboard.
  2. Add your indexers (it integrates with Prowlarr the same way Radarr and
     Sonarr do) and download clients.
  3. Add a root folder under the shared media library and set your download
     client paths to the shared /downloads folder.


  This app is fully separate from any other app in this store. It is provided
  as-is using a community-maintained image; see the Servarr wiki for details.
developer: Your Name
website: https://whisparr.com
repo: https://github.com/Whisparr/Whisparr
support: https://wiki.servarr.com/whisparr
port: 6969
gallery:
  - https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/whisparr-icon.png
path: ""
dependencies: []
defaultUsername: ""
defaultPassword: ""
permissions:
  - STORAGE_DOWNLOADS
  - STORAGE_MEDIA
releaseNotes: >-
  Adds Whisparr to this store as a fully separate app. Integrates with Prowlarr
  and the rest of the *arr family using the shared downloads and media folders.
  Uses the community-maintained hotio image (ghcr.io/hotio/whisparr:latest).
submitter: Your Name
submission: https://github.com/rammpoirammpo-glitch/upload-manager
