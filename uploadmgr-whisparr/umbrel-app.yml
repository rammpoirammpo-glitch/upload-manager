manifestVersion: 1.1
id: uploadmgr-whisparr
category: media
name: Whisparr
version: "2.2.0.141"
tagline: Manage your adult media collection
icon: https://i.imgur.com/3jVS6lO.png
description: >-
  Whisparr is an adult media collection manager for Usenet and BitTorrent users.
  It can monitor multiple RSS feeds for new movies and scenes and will interface
  with download clients and indexers to grab, sort and rename them, and can be
  configured to automatically upgrade the quality of existing files in the
  library when a better quality format becomes available.


  🛠️ SETUP INSTRUCTIONS

  Whisparr on umbrelOS automatically connects to download clients installed from
  the umbrelOS App Store. Simply install Transmission (or qBittorrent / SABnzbd)
  from the umbrelOS App Store and the connection is set up for you.


  All you need to do from there is add an indexer so Whisparr can search for
  content. You can add indexers directly within Whisparr, or install Prowlarr
  from the umbrelOS App Store and add your indexers there - they become
  available in Whisparr automatically.

  Note: Prowlarr's umbrelOS auto-configurator only wires up Radarr/Sonarr/
  Lidarr/Readarr. To use Whisparr with Prowlarr, add Whisparr manually in
  Prowlarr (Settings -> Apps -> Add Application -> Whisparr) with the internal
  URL http://uploadmgr-whisparr_server_1:6969 and Whisparr's API key.

  This app is fully separate from any other app in this store.
developer: Whisparr
website: https://whisparr.com
repo: https://github.com/Whisparr/Whisparr
support: https://github.com/Whisparr/Whisparr/issues
port: 6969
gallery:
  - https://i.imgur.com/3jVS6lO.png
path: ""
dependencies:
  - transmission
defaultUsername: ""
defaultPassword: ""
torOnly: false
permissions:
  - STORAGE_DOWNLOADS
releaseNotes: >-
  Adds Whisparr to this store as a standalone app, separate from Upload Manager.
  Uses the official umbrelOS media-app-configurator so it auto-connects to
  Transmission (and optionally qBittorrent/SABnzbd) installed from the umbrelOS
  App Store. Indexers are added via Prowlarr or directly. Image pinned to a fixed
  digest for stability.
submitter: rammpoirammpo-glitch
submission: https://github.com/rammpoirammpo-glitch/upload-manager
