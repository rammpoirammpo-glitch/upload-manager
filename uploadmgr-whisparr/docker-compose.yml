version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: uploadmgr-whisparr_server_1
      APP_PORT: 6969
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    # hotio tracks the current Whisparr (2.2.0) and is verified to pull+run on
    # umbrelOS. Pinned to the latest manifest digest for stability.
    image: ghcr.io/hotio/whisparr:latest@sha256:c97884f746e7209c42412fb1cdcc232c9711d273675e1ebb96df9da2225aadd5
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure

  # umbrelOS "Media App Configurator": automatically wires Whisparr to download
  # clients (Transmission, optional qBittorrent/SABnzbd) installed from the
  # umbrelOS App Store, the same way Radarr/Sonarr auto-connect.
  mac:
    image: getumbrel/media-app-configurator:v1.3.2@sha256:9ff34bda1e36ffe5a028d2463f4aaa9f20b93e8bec4392da077137c56bea3c34
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    environment:
      APP_ID: "uploadmgr-whisparr"
      APP_URL: "http://uploadmgr-whisparr_server_1:6969"
      TRANSMISSION_HOST: "transmission_server_1"
      TRANSMISSION_PORT: 9091
      ROOT_FOLDER: "/downloads"
      # optional qBittorrent download client
      QBITTORRENT_INSTALLED: ${APP_WHISPARR_QBITTORRENT_INSTALLED:-"false"}
      QBITTORRENT_HOST: "qbittorrent_server_1"
      QBITTORRENT_PORT: 8080
      # optional SABnzbd download client
      SABNZBD_INSTALLED: ${APP_WHISPARR_SABNZBD_INSTALLED:-"false"}
      SABNZBD_HOST: "sabnzbd_web_1"
      SABNZBD_PORT: 8080
      SABNZBD_API_KEY: ${APP_WHISPARR_SABNZBD_API_KEY:-""}
