manifestVersion: 1.1
id: uploadmgr-tgdl
category: social
name: Telegram Media Downloader
version: "2.8.0"
tagline: Bulk-download media from Telegram with a graphical UI
icon: https://raw.githubusercontent.com/rammpoirammpo-glitch/upload-manager/main/uploadmgr-tgdl/icon.svg
description: >-
  Telegram Bulk Media Downloader with a full graphical dashboard. Bulk-download
  videos, images, PDFs, audio and more from any Telegram channel or group.
  Features a premium dashboard with analytics, global queue tracking, task
  management (prioritize & cancel), category browser, real-time search,
  parallel downloads, smart deduplication, speed limiter and proxy support.


  THIS APP RUNS A GRAPHICAL INTERFACE IN YOUR BROWSER

  umbrelOS is headless, so the Qt/PySide6 desktop interface is rendered on a
  virtual display and served to your browser through noVNC (a web-based VNC
  viewer). Open the app and you will see the full graphical dashboard you can
  interact with like a normal desktop window.


  SETUP

  1. Open the app (noVNC interface loads in the browser).
  2. Log in with your Telegram account inside the interface.
  3. Pick a channel/group and download media (videos, images, documents, audio).

  Note: your Telegram API_ID / API_HASH must be configured. By default the app
  uses placeholder values - edit the .env file inside the app's data volume, or
  enter your credentials in the app settings, then restart the app.
developer: vinodkr494
website: https://github.com/vinodkr494/telegram-media-downloader
repo: https://github.com/vinodkr494/telegram-media-downloader
support: https://github.com/vinodkr494/telegram-media-downloader/issues
port: 8080
gallery:
  - https://raw.githubusercontent.com/rammpoirammpo-glitch/upload-manager/main/uploadmgr-tgdl/icon.svg
path: ""
dependencies: []
defaultUsername: ""
defaultPassword: ""
permissions:
  - STORAGE_DOWNLOADS
releaseNotes: >-
  Adds Telegram Bulk Media Downloader v2.8.0 as a browser-accessible GUI app.
  Runs the PySide6 desktop interface on a virtual display (Xvfb) exposed via
  noVNC so it is usable on headless umbrelOS.
submitter: rammpoirammpo-glitch
