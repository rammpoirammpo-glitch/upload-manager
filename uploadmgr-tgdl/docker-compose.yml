version: "3.8"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: uploadmgr-tgdl_server_1
      APP_PORT: 8080

  server:
    # Published automatically by .github/workflows/build-tgdl.yml.
    image: ghcr.io/rammpoirammpo-glitch/upload-manager/tgdl:latest
    restart: on-failure
    environment:
      # noVNC web UI is served on port 8080 inside the container
      RESOLUTION: "1280x800"
    volumes:
      # Persistent app source, config, session, database and downloads.
      - ${APP_DATA_DIR}/data:/data
