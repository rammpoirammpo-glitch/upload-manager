<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b3da6"/>
      <stop offset="1" stop-color="#30206b"/>
    </linearGradient>
    <linearGradient id="down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd24d"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg)"/>

  <!-- tray / folder -->
  <rect x="24" y="30" width="52" height="40" rx="6" fill="#ffffff" opacity="0.14"/>

  <!-- arrow pointing down = downloader -->
  <polyline points="34,44 50,60 66,44" fill="none" stroke="url(#down)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="50" y1="28" x2="50" y2="58" stroke="url(#down)" stroke-width="7" stroke-linecap="round"/>

  <!-- play glyph (Plex/media) -->
  <path d="M44 40 l12 8 -12 8 z" fill="#e0d4ff"/>
</svg>