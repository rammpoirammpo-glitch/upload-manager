id: uploadmgr-reaparr
category: media
name: Reaparr
version: "0.39.0"
tagline: Plex media downloader for Sonarr & Radarr
icon: https://cdn.jsdelivr.net/gh/rammpoirammpo-glitch/upload-manager@main/uploadmgr-reaparr/icon.svg
description: >-
  Reaparr is a Plex media downloader. It registers itself inside Sonarr and
  Radarr as a Torznab-compatible indexer and a qBittorrent download client, so
  you can search from within Sonarr/Radarr and Reaparr downloads the media from
  other Plex servers you have access to.


  ## Setup

  1. Install this app and open its dashboard (the Reaparr web UI).
  2. On first run, log in with your **Plex account** — there are no default
     username/password credentials.
  3. If you want Reaparr to serve Sonarr/Radarr: open
     **Settings -> Integrations**, add your Sonarr and Radarr URLs plus their
     API keys, and Reaparr configures itself inside them with a single click.


  ## Notes

  - Requires a Plex account with access to at least one Plex server.
  - This app is fully separate from the other apps in this store.
