releaseNotes: >-
  Adds Reaparr 0.39.0 to this store, running the official reaparr/reaparr image
  (pinned to its multi-arch manifest digest) behind the umbrelOS app proxy on
  port 7000. Data lives under this app's directory (Config, Downloads, Movies,
  TvShows) and runs as PUID/PGID 1000. First-run logs in with a Plex account
  (no default credentials); Sonarr/Radarr connect via Settings -> Integrations.
