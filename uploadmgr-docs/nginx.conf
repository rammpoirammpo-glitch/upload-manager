# Reaparr Docs — stateless reverse-proxy to the official docs site.
# Fronts https://reaparr.rocks (which 302-redirects to www.reaparr.rocks)
# inside the umbrelOS app proxy so it feels like a native app.
events {
  worker_connections 1024;
}

http {
  # Keep the container lean and quiet — no access/error files needed.
  access_log off;
  error_log stderr warn;

  sendfile on;
  tcp_nopush on;

  # The cloud front accepts long-polling stays alive; 60s is plenty.
  keepalive_timeout 65;

  upstream docs {
    server www.reaparr.rocks:443;
    keepalive 8;
  }

  server {
    listen 8080;
    server_name _;

    # Forward all requests to the docs site over HTTPS.
    location / {
      proxy_pass https://docs;
      proxy_http_version 1.1;
      proxy_set_header Host www.reaparr.rocks;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # large Nuxt HTML/CSS/JS bundles must not be truncated
      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 8 32k;
    }
  }
}