releaseNotes: >-
  Initial release. Adds a "Reaparr Docs" app to this store that opens the
  official Reaparr documentation website (reaparr.rocks) inside the Umbrel
  dashboard via a lightweight, stateless nginx reverse-proxy on port 8055.
  No background workers, no database and no extra permissions, so it stays
  perfectly stable on 24/7 devices.
