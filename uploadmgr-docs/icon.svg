<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2b33"/>
      <stop offset="1" stop-color="#16161c"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset="1" stop-color="#c01818"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg)"/>

  <!-- open book -->
  <path d="M50 28
           C 44 24, 34 23, 26 24
           L 26 68
           C 34 67, 44 68, 50 72
           C 56 68, 66 67, 74 68
           L 74 24
           C 66 23, 56 24, 50 28 Z"
        fill="url(#book)"/>
  <!-- spine -->
  <line x1="50" y1="30" x2="50" y2="71" stroke="#8c1111" stroke-width="2"/>

  <!-- text lines (left page) -->
  <rect x="31" y="36" width="15" height="2.6" rx="1.3" fill="#fbe0e0"/>
  <rect x="31" y="42" width="15" height="2.6" rx="1.3" fill="#fbe0e0"/>
  <rect x="31" y="48" width="12" height="2.6" rx="1.3" fill="#f0bbbb"/>

  <!-- text lines (right page) -->
  <rect x="55" y="36" width="15" height="2.6" rx="1.3" fill="#fbe0e0"/>
  <rect x="55" y="42" width="15" height="2.6" rx="1.3" fill="#fbe0e0"/>
  <rect x="55" y="48" width="12" height="2.6" rx="1.3" fill="#f0bbbb"/>

  <!-- nodes / links -->
  <circle cx="30" cy="61" r="3" fill="#ff8a8a"/>
  <circle cx="42" cy="61" r="3" fill="#ff8a8a"/>
  <line x1="33" y1="61" x2="39" y2="61" stroke="#ffb3b3" stroke-width="2"/>
  <circle cx="58" cy="61" r="3" fill="#ff8a8a"/>
  <circle cx="70" cy="61" r="3" fill="#ff8a8a"/>
  <line x1="61" y1="61" x2="67" y2="61" stroke="#ffb3b3" stroke-width="2"/>
</svg>